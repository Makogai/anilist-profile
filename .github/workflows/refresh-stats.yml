# Keeps the AniList numbers on the profile current: fetches Makogai's stats once a day and, when a
# number changed, re-renders the stats, genre and milestone panels and commits them. about.md serves
# those three from main (raw.githubusercontent.com), so AniList picks them up without a re-paste.
name: Refresh AniList stats

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render the panels even if the stats did not change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    # Windows runner: the panels use Bahnschrift and Segoe UI, which ship with Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Install Python packages
        run: pip install -r build/requirements.txt

      - name: Cache Noto JP fonts
        uses: actions/cache@v6
        with:
          path: build/fonts
          key: noto-jp-v1

      - name: Download Noto JP fonts (OFL, not on the runner)
        run: |
          mkdir -p build/fonts
          cd build/fonts
          [ -f "NotoSansJP[wght].ttf" ] || curl -fsSL -o "NotoSansJP[wght].ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          [ -f "NotoSerifJP[wght].ttf" ] || curl -fsSL -o "NotoSerifJP[wght].ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notoserifjp/NotoSerifJP%5Bwght%5D.ttf"

      - name: Check fonts
        working-directory: build
        run: python -c "from common import font_path; [print(n, font_path(n)) for n in ('bahn', 'segoe', 'segoeb', 'serifjp', 'sansjp', 'icons')]"

      - name: Fetch stats and re-render changed panels
        working-directory: build
        run: python refresh.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and push
        run: |
          git add data/stats.json profile/stats.webp profile/genres.webp profile/milestones.webp
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh AniList stats ($(date -u +%Y-%m-%d))"
          git push
